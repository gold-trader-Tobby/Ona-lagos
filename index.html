<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B2E">
<title>Ọ̀nà Lagos — maps, navigation and transit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --green:#0E3B2E; --leaf:#12805A; --danfo:#F2B705; --red:#D6262C; --blue:#1F5FBF; --brt:#7A3FB0;
  --surface:#FFFFFF; --surface2:#EEF3F0; --text:#0E3B2E; --muted:#55665E; --line:#D3DDD7;
  --btn-bg:#0E3B2E; --btn-fg:#FFFFFF; --shadow:0 6px 24px rgba(14,59,46,.2);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --surface:#11261F; --surface2:#1A372D; --text:#E8F1EC; --muted:#9FB5AA; --line:#2B4A3E;
  --btn-bg:#F2B705; --btn-fg:#0E3B2E; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--surface);color:var(--text);overflow:hidden;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4}
#map{position:fixed;inset:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--danfo);outline-offset:2px}
[hidden]{display:none!important}

.top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;pointer-events:none}
.panel{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:10px}
.brand{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.logo{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
.tag{color:var(--muted);font-size:13px;flex:1}
.icon-btn{border:0;background:var(--surface2);border-radius:12px;min-width:40px;height:40px;display:grid;place-items:center;font-size:18px;padding:0 8px}
.fields{display:grid;gap:6px;position:relative}
.field{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:0 4px 0 12px}
.field input{flex:1;border:0;background:transparent;height:44px;min-width:0;font-size:16px;outline:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.o{background:var(--surface);border:3px solid var(--green)}
.dot.d{background:var(--red)}
.mic{background:var(--btn-bg)!important;color:var(--btn-fg)}
.mic svg{width:20px;height:20px}
.sugg{list-style:none;margin:4px 0 0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:260px;overflow:auto}
.sugg button{width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:8px}
.sugg button:hover,.sugg button:focus{background:var(--surface2)}
.sugg small{display:block;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:8px;align-items:center}
.go{flex:1;border:0;border-radius:12px;height:46px;background:var(--btn-bg);color:var(--btn-fg);font-weight:700;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:700}
.cat[aria-pressed="true"]{border-color:var(--green);background:var(--surface2)}

.fabs{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);z-index:4;display:grid;gap:8px}
.fab{width:50px;height:50px;border-radius:16px;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:22px;display:grid;place-items:center}
.fab.report{background:var(--danfo);color:#0E3B2E;
  background-image:linear-gradient(transparent 70%,#0E3B2E 70%,#0E3B2E 76%,transparent 76%,transparent 82%,#0E3B2E 82%,#0E3B2E 88%,transparent 88%)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
.sheet .panel{max-height:52vh;overflow:auto}
.sheet h2{font-family:"Bricolage Grotesque",Georgia,serif;font-size:19px;margin:2px 44px 4px 4px;line-height:1.2}
.when{font-size:13px;color:var(--muted);margin:0 4px 8px}
.close{float:right}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin:4px 0 8px}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 6px;text-align:center;display:grid;gap:1px}
.mode .e{font-size:22px}
.mode .l{font-weight:700;font-size:14px}
.mode .t{font-size:13px;color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--danfo);border-color:#0E3B2E;color:#0E3B2E}
.mode[aria-pressed="true"] .t{color:#0E3B2E}
.mode.na{opacity:.5}
.summary{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px 6px;gap:8px}
.summary b{font-family:"Bricolage Grotesque",Georgia,serif;font-size:24px}
.steps{margin:6px 4px 4px;padding-left:20px}
.steps li{margin:4px 0}
.note{font-size:13px;background:var(--surface2);border-left:4px solid var(--danfo);border-radius:8px;padding:8px 10px;margin:6px 4px}
.note.warn{border-left-color:var(--red)}
.note.lit{border-left-color:#E9C300}
.plist{list-style:none;padding:0;margin:0}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.plist li span{flex:1}
.plist small{color:var(--muted)}
.plist button{border:0;border-radius:10px;padding:7px 12px;background:var(--btn-bg);color:var(--btn-fg);font-weight:700}

.layers{position:fixed;z-index:6;right:10px;top:calc(env(safe-area-inset-top,0px) + 70px);width:270px}
.layers label{display:flex;gap:10px;align-items:center;padding:7px 4px}
.layers select{border:1.5px solid var(--line);border-radius:8px;background:var(--surface2);padding:4px 6px}
.layers .link{width:100%;margin-top:6px;border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px;font-weight:700}

/* Navigation */
.navtop{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:7;max-width:560px;margin:0 auto;
  background:var(--leaf);color:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;align-items:center}
.arrow{font-size:42px;line-height:1;width:52px;text-align:center}
.navtop .dist{font-family:"Bricolage Grotesque",Georgia,serif;font-size:26px;font-weight:800;line-height:1}
.navtop .ins{font-size:17px;margin-top:2px}
.alert{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 112px);z-index:7;background:var(--danfo);color:#0E3B2E;
  font-weight:700;border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);white-space:nowrap}
.navbot{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:7;max-width:560px;margin:0 auto;
  background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:10px}
.eta{flex:1}
.eta b{font-family:"Bricolage Grotesque",Georgia,serif;font-size:22px;display:block;line-height:1.1}
.eta span{font-size:13px;color:var(--muted)}
.speed{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px;line-height:1}
.speed small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.end{border:0;border-radius:12px;height:44px;padding:0 16px;background:var(--red);color:#fff;font-weight:700}
.puck{width:30px;height:30px}
.puck svg{width:30px;height:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}

.modal{position:fixed;inset:0;z-index:9;background:rgba(14,59,46,.6);display:grid;place-items:end center;padding:10px}
.modal .panel{width:min(520px,100%);margin-bottom:env(safe-area-inset-bottom,0px)}
.modal h2{font-family:"Bricolage Grotesque",Georgia,serif;font-size:20px;margin:2px 4px 10px}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rgrid button{border:0;background:var(--surface2);border-radius:14px;padding:10px 4px;display:grid;gap:4px;font-size:12.5px;font-weight:700}
.rgrid button span{font-size:26px}
.rep{font-size:22px;width:36px;height:36px;border-radius:50%;background:#fff;border:2.5px solid #0E3B2E;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.poi{font-size:18px;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--leaf);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}

.voice{position:fixed;inset:0;z-index:9;background:rgba(14,59,46,.72);display:grid;place-items:center;padding:20px}
.voice .panel{text-align:center;width:min(420px,100%)}
.pulse{width:84px;height:84px;margin:10px auto 14px;border-radius:50%;background:var(--danfo);display:grid;place-items:center;animation:p 1.4s infinite}
.pulse svg{width:38px;height:38px;color:#0E3B2E}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(242,183,5,.6)}100%{box-shadow:0 0 0 26px rgba(242,183,5,0)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
#vtext{font-size:18px;min-height:52px;margin:0 0 10px}
.vrow{display:flex;gap:8px;justify-content:center}
.vrow select,.vrow button{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:10;background:var(--green);color:#fff;padding:10px 14px;border-radius:12px;max-width:90vw;font-size:14px;text-align:center}
.pin{width:22px;height:22px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pin.o{background:var(--green)} .pin.d{background:var(--red)}
.maplibregl-popup-content{font-family:inherit;border-radius:12px;padding:10px 12px;color:#0E3B2E}
.pop b{display:block;margin-bottom:4px}
.pop button{margin:6px 6px 0 0;border:0;border-radius:8px;padding:6px 8px;background:#EEF3F0;font-weight:700;font-size:13px;color:#0E3B2E}
</style>
</head>
<body>
<div id="map" aria-label="Map of Lagos"></div>

<header class="top" id="top">
  <div class="panel">
    <div class="brand">
      <span class="logo">Ọ̀nà</span>
      <span class="tag">Lagos maps and transit</span>
      <button class="icon-btn" id="layersBtn" aria-label="Map layers" aria-expanded="false">◱</button>
    </div>
    <div class="fields">
      <div class="field"><span class="dot o"></span>
        <input id="from" placeholder="From (blank = my location)" autocomplete="off" aria-label="Start">
        <button class="icon-btn" id="locBtn" aria-label="Use my current location">◎</button>
      </div>
      <div class="field"><span class="dot d"></span>
        <input id="to" placeholder="Where to? Bus stop, street, place" autocomplete="off" aria-label="Destination">
        <button class="icon-btn mic" id="micBtn" aria-label="Say your start and destination">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
      </div>
      <ul class="sugg" id="sugg" hidden></ul>
    </div>
    <div class="row"><button class="go" id="goBtn">Directions</button></div>
    <div class="cats" id="cats" role="group" aria-label="Find nearby"></div>
  </div>
</header>

<div class="fabs" id="fabs">
  <button class="fab" id="meBtn" aria-label="Show my location">➤</button>
  <button class="fab report" id="repBtn" aria-label="Report something on the road">!</button>
</div>

<aside class="layers" id="layers" hidden>
  <div class="panel">
    <label><input type="checkbox" id="lySat"> Satellite imagery</label>
    <label><input type="checkbox" id="ly3d" checked> 3D buildings</label>
    <label><input type="checkbox" id="lyLights" checked> Street lights</label>
    <label><input type="checkbox" id="lyReports" checked> Road reports</label>
    <label><input type="checkbox" id="lyTransit" checked> Rail, BRT and bus parks</label>
    <label>Map look <select id="theme"><option value="auto">Auto (Lagos time)</option><option value="day">Day</option><option value="night">Night</option></select></label>
    <button class="link" id="osh3d">Explore Oshodi loading bays in 3D</button>
  </div>
</aside>

<section class="sheet" id="sheet" hidden><div class="panel" id="sheetBody"></div></section>

<!-- Navigation -->
<div class="navtop" id="navTop" hidden><div class="arrow" id="navArrow">↑</div><div><div class="dist" id="navDist"></div><div class="ins" id="navIns"></div></div></div>
<div class="alert" id="navAlert" hidden></div>
<div class="navbot" id="navBot" hidden>
  <div class="speed" id="navSpeed">0<small>km/h</small></div>
  <div class="eta"><b id="navEta"></b><span id="navRem"></span></div>
  <button class="icon-btn" id="navMute" aria-label="Mute voice guidance">🔊</button>
  <button class="icon-btn" id="navRep" aria-label="Report">!</button>
  <button class="end" id="navEnd">End</button>
</div>

<div class="modal" id="repModal" hidden>
  <div class="panel">
    <button class="icon-btn close" id="repClose" aria-label="Close">✕</button>
    <h2>What do you see?</h2>
    <div class="rgrid" id="rgrid"></div>
    <div class="note">Reports are saved on this device for now. Sharing them live with other drivers needs a backend.</div>
  </div>
</div>

<div class="voice" id="voice" hidden>
  <div class="panel">
    <div class="pulse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
    <p id="vtext">Say “From Ikeja to Yaba” or “I dey Oshodi, I wan go CMS”</p>
    <div class="vrow">
      <select id="vlang" aria-label="Speech language">
        <option value="en-NG">English (Nigeria)</option>
        <option value="en-GB">English (UK)</option>
        <option value="en-US">English (US)</option>
      </select>
      <button id="vstop">Done</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>

/* ======================= Street lights (OpenStreetMap via Overpass) ======================= */
const lightTiles=new Set();let lightHint=false;
function addLightElements(els){
  for(const e of els){
    if(e.type==='node'&&e.lat)lightItems.set('n'+e.id,{type:'Feature',properties:{},geometry:{type:'Point',coordinates:[e.lon,e.lat]}});
    else if(e.type==='way'&&e.geometry)lightItems.set('w'+e.id,{type:'Feature',properties:{lit:(e.tags&&e.tags.lit)||'yes'},geometry:{type:'LineString',coordinates:e.geometry.map(g=>[g.lon,g.lat])}});
  }
  const all=[...lightItems.values()];
  setFC('lamps',fc(all.filter(f=>f.geometry.type==='Point')));
  setFC('lit',fc(all.filter(f=>f.geometry.type==='LineString')));
}
async function loadLights(){
  if(!$('#lyLights').checked)return;
  if(map.getZoom()<15){if(!lightHint&&map.getZoom()>12){lightHint=true;toast('Zoom in closer to see street lights.');}return;}
  const c=map.getCenter(),key=(c.lat*100|0)+':'+(c.lng*100|0);
  if(lightTiles.has(key))return;lightTiles.add(key);
  const s=(key.split(':')[0])/100,w=(key.split(':')[1])/100;
  const bb=`${s-0.006},${w-0.006},${s+0.016},${w+0.016}`;
  try{const j=await overpass(`[out:json][timeout:25];(node["highway"="street_lamp"](${bb});way["highway"]["lit"](${bb}););out geom;`);addLightElements(j.elements||[]);}
  catch(e){lightTiles.delete(key);}
}
async function routeLighting(coords){
  let s=90,w=180,n=-90,e=-180;for(const [x,y] of coords){s=Math.min(s,y);n=Math.max(n,y);w=Math.min(w,x);e=Math.max(e,x);}
  if((n-s)*(e-w)>0.03)return null;
  const j=await overpass(`[out:json][timeout:25];node["highway"="street_lamp"](${s-.001},${w-.001},${n+.001},${e+.001});out;`);
  const lamps=(j.elements||[]);addLightElements(lamps);
  const grid=new Map();for(const l of lamps){const k=Math.round(l.lat/.0005)+':'+Math.round(l.lon/.0005);(grid.get(k)||grid.set(k,[]).get(k)).push(l);}
  let total=0,lit=0;const cum=cumDist(coords),len=cum[cum.length-1];
  for(let d=0;d<len;d+=30){const p=pointAt(coords,cum,d);total++;
    const gy=Math.round(p.lat/.0005),gx=Math.round(p.lng/.0005);let hit=false;
    for(let dy=-1;dy<=1&&!hit;dy++)for(let dx=-1;dx<=1&&!hit;dx++)for(const l of grid.get((gy+dy)+':'+(gx+dx))||[])if(km(p,{lat:l.lat,lng:l.lon})<.04){hit=true;break;}
    if(hit)lit++;}
  const pct=total?lit/total:0;
  return {count:lamps.length,label:pct>=.5?'Well lit':pct>=.2?'Partly lit':'Few mapped street lights',pct};
}

/* ======================= 3D bus-park loading areas (schematic) ======================= */
function toLL(p,[x,y]){const r=toRad(p.rot||0),xr=x*Math.cos(r)-y*Math.sin(r),yr=x*Math.sin(r)+y*Math.cos(r);
  return [p.lng+xr/(111320*Math.cos(toRad(p.lat))),p.lat+yr/110540];}
const rect=(cx,cy,w,h)=>[[cx-w/2,cy-h/2],[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2],[cx-w/2,cy-h/2]];
function buildPark(p){
  const polys=[],labels=[],add=(ring,props)=>polys.push({type:'Feature',properties:props,geometry:{type:'Polygon',coordinates:[ring.map(q=>toLL(p,q))]}});
  const bays=p.bays||[],perRow=6,rows=Math.ceil(bays.length/perRow),pitch=10,bayL=14,gap=28,width=perRow*pitch+16;
  add(rect(0,(rows-1)*gap/2,width+12,rows*gap+44),{kind:'apron',h:.12,b:0,c:'#9AA39E'});
  add(rect(0,-26,width*.75,12),{kind:'terminal',h:9,b:0,c:'#ECE6D6'});
  add(rect(-width/2-2,(rows-1)*gap/2,4,rows*gap),{kind:'kiosks',h:3,b:0,c:'#C0533A'});
  for(let r=0;r<rows;r++){add(rect(0,r*gap,width,bayL+6),{kind:'canopy',h:6.4,b:5.8,c:'#BFCAC4'});
    if(r<rows-1)add(rect(0,r*gap+gap/2,width,4),{kind:'walkway',h:.3,b:0,c:'#E5E1D6'});}
  bays.forEach((dest,i)=>{const r=Math.floor(i/perRow),k=i%perRow,x=(k-(perRow-1)/2)*pitch,y=r*gap;
    add(rect(x,y,4.5,bayL),{kind:'bay',h:.25,b:0,c:'#F5F1E6'});
    add(rect(x,y+1,2.3,5.8),{kind:'bus',h:2.6,b:.35,c:['#F2B705','#E9A800','#F7C948'][i%3]});
    labels.push({type:'Feature',properties:{label:`${i+1} ${dest}`},geometry:{type:'Point',coordinates:toLL(p,[x,y-bayL/2-3])}});});
  return {polys,labels};
}
function show3DPark(id){
  const p=STOP[id];if(!p||!p.bays)return;const {polys,labels}=buildPark(p);
  setFC('park3d',fc(polys));setFC('bayLabels',fc(labels));
  map.flyTo({center:[p.lng,p.lat],zoom:18.3,pitch:64,bearing:(p.rot||0)+25,duration:2200});
  $('#ly3d').checked=true;applyLayerVis();
  $('#sheetBody').innerHTML=`<button class="icon-btn close" aria-label="Close" onclick="closeSheet()">✕</button><h2>${esc(p.name)}</h2>
    <ul class="steps">${p.bays.map((d,i)=>`<li>Bay ${i+1}: buses to ${esc(d)}</li>`).join('')}</ul>
    <div class="note">Loading-bay layout is schematic. Replace it with a drone-mapped or surveyed model and confirm each bay with park officials.</div>
    <div class="row"><button class="go" onclick="setPoint('to','${id}')">Directions here</button></div>`;
  $('#sheet').hidden=false;
}

function setField(which,p){const el=$('#'+which);el.value=p.name;el.dataset.lat=p.lat;el.dataset.lng=p.lng;el.dataset.name=p.name;}

const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(bus ?stop|park|motor park|station|garage|junction|side)\b/g,' ').replace(/\s+/g,' ').trim();
function gazMatches(q){
  const n=norm(q);if(!n)return [];const rank={park:.3,place:.2,brt:.1,rail:0},out=[];
  for(const s of STOPS){let bs=0;
    for(const name of [s.name,...s.aka]){const m=norm(name);let sc=0;
      if(m===n)sc=3;else if(m.startsWith(n)||(n.length>3&&(m.includes(n)||n.includes(m))))sc=2;
      else{const a=n.split(' '),b=m.split(' ');sc=a.filter(w=>w.length>2&&b.includes(w)).length/Math.max(a.length,b.length);}
      bs=Math.max(bs,sc?sc+rank[s.kind]:0);}
    if(bs>=.75)out.push({s,bs});}
  return out.sort((a,b)=>b.bs-a.bs).slice(0,4).map(x=>({lat:x.s.lat,lng:x.s.lng,name:x.s.name,sub:{park:'Bus park',brt:'BRT stop',rail:'Train station',place:'Lagos'}[x.s.kind]}));
}
async function photon(q){
  const j=await getJSON(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=6.52&lon=3.38&limit=7&bbox=2.6,6.2,4.4,6.95`,{},6000);
  return (j.features||[]).filter(f=>!f.properties.countrycode||f.properties.countrycode==='NG').map(f=>{const p=f.properties;
    return {lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],name:p.name||[p.housenumber,p.street].filter(Boolean).join(' ')||'Place',
      sub:[p.street&&p.name?p.street:null,p.district||p.locality,p.city||p.county].filter(Boolean).join(', ')};});
}
async function geocode(q){
  const g=gazMatches(q);if(g.length)return g[0];
  try{const r=await photon(q);if(r[0])return r[0];}catch(e){}
  try{const j=await getJSON('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ng&viewbox=2.70,6.80,4.35,6.30&q='+encodeURIComponent(q+', Lagos'));
    if(j[0])return {lat:+j[0].lat,lng:+j[0].lon,name:j[0].display_name.split(',')[0]};}catch(e){}
  return null;
}
let suggFor=null,suggT=null;
function showSugg(which,items){

}
$('#sugg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const it=$('#sugg')._items[+b.dataset.i];

['from','to'].forEach(id=>{const el=$('#'+id);

function myLocation(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('no-geo'));
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,name:'My location'}),rej,{enableHighAccuracy:true,timeout:9000,maximumAge:30000});});}
async function resolve(which){
  const el=$('#'+which),v=el.value.trim();
  if(el.dataset.lat&&el.dataset.name===v)return {lat:+el.dataset.lat,lng:+el.dataset.lng,name:v};
  if(!v||/^(my location|here|where i dey|current location)$/i.test(v)){
    let p;try{p=await myLocation();}catch(e){throw new Error('Location is off. Type where you’re starting from.');}
    if(!inNigeria(p))throw new Error('You’re outside Nigeria right now. Type a Lagos start point to plan or preview a trip.');
    return p;}
  const g=await geocode(v);if(!g)throw new Error(`Couldn’t find “${v}”. Try a nearby bus stop, street or landmark.`);

}

/* ======================= Routing ======================= */
const OSRM={driving:'https://router.project-osrm.org/route/v1/driving/',foot:'https://routing.openstreetmap.de/routed-foot/route/v1/driving/',bike:'https://routing.openstreetmap.de/routed-bike/route/v1/driving/'};
const routeCache=new Map();
async function roadRoute(profile,a,b){
  const key=[profile,a.lng,a.lat,b.lng,b.lat].map(x=>typeof x==='number'?x.toFixed(5):x).join();
  if(routeCache.has(key))return routeCache.get(key);
  try{const j=await getJSON(`${OSRM[profile]}${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&steps=true`,{},9000);
    if(j.routes&&j.routes[0]){const r=j.routes[0];
      const out={coords:r.geometry.coordinates,km:r.distance/1000,steps:r.legs[0].steps.map(s=>({text:instr(s),arrow:arrowFor(s),loc:s.maneuver.location}))};
      routeCache.set(key,out);return out;}}catch(e){}
  return null;
}
const DIRS=['north','north-east','east','south-east','south','south-west','west','north-west'];
function instr(st){const m=st.maneuver,t=m.type,mod=m.modifier||'',road=st.name?` onto ${st.name}`:'';
  if(t==='depart')return `Head ${DIRS[Math.round((m.bearing_after||0)/45)%8]}${st.name?' on '+st.name:''}`;
  if(t==='arrive')return 'You have arrived';
  if(t==='roundabout'||t==='rotary')return `At the roundabout, take exit ${m.exit||1}${road}`;
  if(t==='merge')return `Merge${road}`;
  if(t==='on ramp')return `Take the ramp${road}`;
  if(t==='off ramp')return `Take the exit${road}`;
  if(mod==='uturn')return `Make a U-turn${road}`;
  if(mod==='straight')return `Continue straight${road}`;
  if(t==='fork')return `Keep ${mod.replace('slight ','')}${road}`;
  if(t==='new name'||t==='continue')return `Continue${road}`;
  if(mod.startsWith('slight'))return `Bear ${mod.split(' ')[1]}${road}`;
  return `Turn ${mod}${road}`;}
function arrowFor(st){const m=st.maneuver;if(m.type==='arrive')return '⚑';if(m.type==='roundabout'||m.type==='rotary')return '⟳';
  return {left:'↰',right:'↱','sharp left':'↰','sharp right':'↱','slight left':'↖','slight right':'↗',uturn:'↶',straight:'↑'}[m.modifier]||'↑';}
const straight=(a,b)=>[[a.lng,a.lat],[b.lng,b.lat]];

function accessLeg(a,b,label){const d=km(a,b)*1.25;
  if(d<=1.2)return {type:'walk',from:a,to:b,km:d,mins:d/4.5*60,fare:[0,0],text:`Walk ${fmtKm(d)} ${label}`};
  return {type:'keke',from:a,to:b,km:d,mins:d/15*60+5,fare:[300,800],color:'#2E8B57',text:`Keke ${fmtKm(d)} ${label}`};}
function lineOptions(o,d,mode,clock){
  const out=[];
  for(const L of Object.values(LINES)){if(L.mode!==mode)continue;
    const st=L.ids.map(id=>STOP[id]),near=p=>st.reduce((bi,s,i)=>km(p,s)<km(p,st[bi])?i:bi,0),i=near(o),j=near(d);
    if(i===j||km(o,st[i])>5||km(d,st[j])>5)continue;
    const seq=i<j?st.slice(i,j+1):st.slice(j,i+1).reverse();let ride=0;for(let k=1;k<seq.length;k++)ride+=km(seq[k-1],seq[k])*1.1;
    const speed=clock.peak&&L.peakSpeed?L.peakSpeed:L.speed;
    out.push([accessLeg(o,seq[0],`to ${seq[0].name}`),
      {type:'ride',color:L.color,coords:seq.map(s=>[s.lng,s.lat]),km:ride,mins:ride/speed*60+L.wait,fare:L.fare,
        text:`${L.name} from ${seq[0].name} to ${seq[seq.length-1].name} (${seq.length-1} stop${seq.length>2?'s':''})`},
      accessLeg(seq[seq.length-1],d,'to your destination')]);}
  return out;
}
function danfoOption(o,d,clock){
  const parks=STOPS.filter(s=>s.kind==='park'),near=p=>parks.reduce((b,s)=>km(p,s)<km(p,b)?s:b,parks[0]);
  const pa=near(o),pb=near(d),speed=clock.peak?10:20;
  if(pa===pb||km(o,d)<3){const k=km(o,d)*1.35;
    return [{type:'danfo',from:o,to:d,color:'#E0A400',km:k,mins:k/speed*60+8,fare:[300,700],text:`Danfo ${fmtKm(k)} towards your destination (tell the conductor where to drop)`}];}
  const k=km(pa,pb)*1.35,bi=(pa.bays||[]).findIndex(x=>norm(pb.name).includes(norm(x)));
  return [accessLeg(o,pa,`to ${pa.name}`),
    {type:'danfo',from:pa,to:pb,color:'#E0A400',km:k,mins:k/speed*60+12,fare:[400,1200],text:`Danfo from ${pa.name}${bi>=0?` (bay ${bi+1})`:''} to ${pb.name}; it leaves when full`},
    accessLeg(pb,d,'to your destination')];
}
const sum=(legs,f)=>legs.reduce((a,l)=>a+(l[f]||0),0);
const sumFare=legs=>[legs.reduce((a,l)=>a+l.fare[0],0),legs.reduce((a,l)=>a+l.fare[1],0)];

async function computeAll(o,d){
  const clock=lagosClock(),sk=km(o,d),res={};
  const flood=clock.rainy?FLOOD_ZONES.filter(([la,ln,r])=>km(o,{lat:la,lng:ln})<=r||km(d,{lat:la,lng:ln})<=r).map(z=>z[3]):[];
  const floodNote=flood.length?{text:`Rainy season: roads around ${flood.join(' and ')} can flood after heavy rain. Check reports before you set out.`}:null;
  const nightNote=clock.night?{text:'It’s night in Lagos. Check the street-lighting rating and stick to main roads where you can.'}:null;
  const [car,foot,bike]=await Promise.all([roadRoute('driving',o,d),roadRoute('foot',o,d),roadRoute('bike',o,d)]);
  if(!car)toast('Live road routing is unavailable, so routes are drawn as straight lines.');
  const road=(r,f)=>r?r:{coords:straight(o,d),km:sk*f,steps:null};
  const c=road(car,1.35),wk=road(foot,1.25),bk=road(bike,1.3);
  const one=(r,type,color,text)=>[{type,color,coords:r.coords,text,steps:r.steps}];

  res.drive={km:c.km,mins:c.km/(clock.peak?13:28)*60,fare:[c.km*90,c.km*130],fareLabel:'fuel',nav:true,legs:one(c,'ride','#12805A',`Drive ${fmtKm(c.km)}`),
    notes:[clock.peak?{warn:true,text:'Rush hour in Lagos. Expect heavy go-slow and allow extra time.'}:null,floodNote,nightNote]};
  res.keke={km:c.km,mins:c.km/(clock.peak?12:18)*60+4,fare:[300+c.km*100,600+c.km*180],nav:true,legs:one(c,'ride','#2E8B57',`Keke ${fmtKm(c.km)}`),
    notes:[{warn:true,text:'Keke is restricted on major highways and bridges in Lagos. Your rider may use a different route or drop you before a highway.'},
      c.km>12?{text:'Long trip for a keke. A danfo or BRT for the middle stretch is usually cheaper and faster.'}:null,floodNote,nightNote]};
  res.okada={km:c.km,mins:c.km/(clock.peak?22:30)*60,fare:[300+c.km*120,500+c.km*200],nav:true,legs:one(c,'ride','#C0533A',`Motorbike ${fmtKm(c.km)}`),
    notes:[(inZone(o,OKADA_ZONES)||inZone(d,OKADA_ZONES))?{warn:true,text:'Commercial okada is restricted in much of central Lagos (state ban since 2022). Check current enforcement, or use keke or BRT.'}:null,
      {text:'Wear a helmet and ask the rider for a passenger helmet.'},floodNote]};
  res.walk={km:wk.km,mins:wk.km/4.5*60,fare:[0,0],nav:true,legs:one(wk,'walk',null,`Walk ${fmtKm(wk.km)}`),
    notes:[wk.km>3?{warn:true,text:'Long walk in Lagos heat. A keke or danfo may be better for part of it.'}:null,floodNote,nightNote]};
  res.bike={km:bk.km,mins:bk.km/13*60,fare:[0,0],nav:true,legs:one(bk,'ride','#1F7A8C',`Cycle ${fmtKm(bk.km)}`),
    notes:[{text:'Few dedicated cycle lanes. Ride early to beat the heat and traffic, and stay visible.'},floodNote,nightNote]};
  const pick=opts=>opts.sort((x,y)=>sum(x,'mins')-sum(y,'mins'))[0];
  const bus=pick([...lineOptions(o,d,'bus',clock),danfoOption(o,d,clock)]);
  res.bus={legs:bus,km:sum(bus,'km'),mins:sum(bus,'mins'),fare:sumFare(bus),nav:true,
    notes:[bus.some(l=>l.type==='danfo')?{text:'Danfo fares change often and are paid in cash. Keep small notes ready.'}:{text:'BRT uses a Cowry card. Top up before you travel.'},
      clock.peak?{warn:true,text:'Peak hour: queues at BRT terminals and parks can be long.'}:null]};
  const train=pick(lineOptions(o,d,'train',clock));
  res.train=train?{legs:train,km:sum(train,'km'),mins:sum(train,'mins'),fare:sumFare(train),nav:true,
    notes:[{text:'Rail runs on a timetable with gaps between trains. Check today’s schedule and pay with a Cowry card.'}]}
    :{na:true,notes:[{warn:true,text:'No Red or Blue Line station is close enough to both points. Try Bus.'}]};
  await Promise.all(Object.values(res).filter(r=>r.legs).flatMap(r=>r.legs).filter(l=>l.from&&!l.coords).map(async l=>{
    const rr=await roadRoute(l.type==='walk'?'foot':'driving',l.from,l.to);l.coords=rr?rr.coords:straight(l.from,l.to);}));
  for(const r of Object.values(res))r.notes=(r.notes||[]).filter(Boolean);
  return {res,clock};
}

/* ======================= Results sheet ======================= */
let selected='drive',current=null,mO=null,mD=null;
function drawRoute(r){
  const feats=(r.legs||[]).filter(l=>l.coords).map(l=>({type:'Feature',properties:{type:l.type==='walk'?'walk':'ride',color:l.color||'#12805A'},geometry:{type:'LineString',coordinates:l.coords}}));
  setFC('route',fc(feats));
  if(feats.length){const bb=new maplibregl.LngLatBounds();feats.forEach(f=>f.geometry.coordinates.forEach(c=>bb.extend(c)));
    map.fitBounds(bb,{padding:{top:Math.min(260,innerHeight*.35),bottom:Math.min(innerHeight*.5,400),left:40,right:70},pitch:0,bearing:0,duration:900,maxZoom:16});}
}
function renderResults(){
  const {res,clock,o,d}=current,r=res[selected];

    return `<button class="mode ${x.na?'na':''}" data-mode="${k}" aria-pressed="${k===selected}"><span class="e">${i}</span><span class="l">${l}</span><span class="t">${x.na?'n/a':fmtMin(x.mins)}</span></button>`;}).join('');
  const steps=r.legs?`<ol class="steps">${r.legs.filter(l=>!(l.km!==undefined&&l.km<0.05)).map(l=>`<li>${esc(l.text)}${l.mins?` (${fmtMin(l.mins)})`:''}</li>`).join('')}</ol>`:'';
  const notes=(r.notes||[]).map(n=>`<div class="note ${n.warn?'warn':''}">${esc(n.text)}</div>`).join('');
  const light=r.light?`<div class="note lit">💡 Street lighting: ${r.light.label} (${r.light.count} lamps mapped nearby). Lagos lighting data is incomplete, so report lights that are out.</div>`:'';
  $('#sheetBody').innerHTML=`<button class="icon-btn close" aria-label="Close" onclick="closeSheet()">✕</button>
    <h2>${esc(o.name)} to ${esc(d.name)}</h2><div class="when">${clock.label}${clock.peak?', rush hour':''}. Times and fares are estimates.</div>
    <div class="modes" id="modeTiles">${tiles}</div>
    ${r.na?'':`<div class="summary"><b>${fmtMin(r.mins)}</b><span>${fmtKm(r.km)}, ${fare(r.fare)}${r.fareLabel?' '+r.fareLabel:''}</span></div>
    <div class="row"><button class="go" id="startBtn">Start ${MODES[selected][0].toLowerCase()}</button></div>`}
    ${light}${steps}${notes}`;
  $('#modeTiles').addEventListener('click',e=>{const b=e.target.closest('.mode');if(b){selected=b.dataset.mode;renderResults();}});
  if($('#startBtn'))$('#startBtn').onclick=()=>startNav(selected);
  $('#sheet').hidden=false;$('#sugg').hidden=true;drawRoute(r);
  if(!r.na&&!r.lightTried&&r.legs){r.lightTried=true;const coords=r.legs.flatMap(l=>l.coords||[]);
    routeLighting(coords).then(x=>{if(x){r.light=x;if(current&&current.res[selected]===r)renderResults();}}).catch(()=>{});}
}
function pin(cls,p){const el=document.createElement('div');el.className='pin '+cls;return new maplibregl.Marker({element:el}).setLngLat([p.lng,p.lat]).addTo(map);}
async function findRoutes(){
  const go=$('#goBtn');go.disabled=true;go.textContent='Finding routes…';$('#sugg').hidden=true;
  try{
    if(!$('#to').value.trim())throw new Error('Type or say where you’re going.');
    const [o,d]=await Promise.all([resolve('from'),resolve('to')]);
    if(km(o,d)<.05)throw new Error('Start and destination are the same place.');
    if(!$('#from').value)setField('from',o);
    mO&&mO.remove();mD&&mD.remove();mO=pin('o',o);mD=pin('d',d);clearPois();
    setFC('park3d',fc());setFC('bayLabels',fc());
    const {res,clock}=await computeAll(o,d);current={res,clock,o,d};renderResults();
  }catch(e){toast(e.message||'Something went wrong. Try again.');}
  finally{go.disabled=false;go.textContent='Directions';}
}
$('#goBtn').onclick=findRoutes;

/* ======================= Turn-by-turn navigation (3D follow camera) ======================= */
function cumDist(coords){const c=[0];for(let i=1;i<coords.length;i++)c.push(c[i-1]+km(P(coords[i-1]),P(coords[i]))*1000);return c;}
function pointAt(coords,cum,d){
  d=Math.max(0,Math.min(d,cum[cum.length-1]));let i=1;while(i<cum.length-1&&cum[i]<d)i++;
  const seg=cum[i]-cum[i-1]||1,t=(d-cum[i-1])/seg,a=coords[i-1],b=coords[i];
  return {lng:a[0]+(b[0]-a[0])*t,lat:a[1]+(b[1]-a[1])*t,bearing:bearing(P(a),P(b))};
}
function snap(coords,cum,p,from,to){
  const kx=111320*Math.cos(toRad(p.lat)),ky=110540;let best={dist:1e9,along:0,i:from};
  for(let i=Math.max(1,from);i<Math.min(coords.length,to);i++){
    const ax=(coords[i-1][0]-p.lng)*kx,ay=(coords[i-1][1]-p.lat)*ky,bx=(coords[i][0]-p.lng)*kx,by=(coords[i][1]-p.lat)*ky;
    const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L)),qx=ax+dx*t,qy=ay+dy*t,dist=Math.hypot(qx,qy);
    if(dist<best.dist)best={dist,along:cum[i-1]+(cum[i]-cum[i-1])*t,i};}
  return best;
}
const SPEED={drive:8,keke:5,okada:8.5,bus:6,train:12,walk:1.3,bike:3.6}; // m/s typical in Lagos traffic
let nav=null,muted=false;
function say(t){if(muted||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices();
  u.voice=vs.find(v=>v.lang==='en-NG')||vs.find(v=>/en[-_]GB/.test(v.lang))||null;speechSynthesis.cancel();speechSynthesis.speak(u);}
function makePuck(){const el=document.createElement('div');el.className='puck';
  el.innerHTML='<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#fff"/><path d="M15 4 L23 24 L15 19 L7 24 Z" fill="#12805A"/></svg>';
  return new maplibregl.Marker({element:el,rotationAlignment:'map',pitchAlignment:'map'});}

async function startNav(mode){
  const r=current.res[mode];if(!r||r.na)return;
  const coords=r.legs.flatMap(l=>l.coords||[]);if(coords.length<2)return;
  let steps=[];
  if(r.legs.length===1&&r.legs[0].steps)steps=r.legs[0].steps;
  else steps=r.legs.map(l=>({text:l.text,arrow:l.type==='walk'?'🚶':l.type==='keke'?'🛺':l.type==='danfo'?'🚐':'🚆',loc:l.coords[0]})).concat([{text:'You have arrived',arrow:'⚑',loc:coords[coords.length-1]}]);
  const cum=cumDist(coords);
  let j=0;steps.forEach(s=>{const sn=snap(coords,cum,P(s.loc),j,coords.length);s.at=sn.along;j=Math.max(1,sn.i-1);});
  const reports=loadReports().map(x=>{const sn=snap(coords,cum,x,1,coords.length);return {...x,at:sn.along,off:sn.dist};}).filter(x=>x.off<40);
  nav={mode,coords,cum,steps,reports,seg:1,spoken:new Set(),off:0,dest:current.d,sim:true,simD:0,watch:null,timer:null,puck:makePuck().setLngLat(coords[0]).addTo(map),lastHeading:0};
  $('#top').hidden=$('#sheet').hidden=$('#fabs').hidden=true;$('#navTop').hidden=$('#navBot').hidden=false;
  $('#ly3d').checked=true;applyLayerVis();
  if(navigator.speechSynthesis)speechSynthesis.getVoices();
  let real=null;try{real=await myLocation();}catch(e){}
  if(real&&inNigeria(real)&&snap(coords,cum,real,1,coords.length).dist<300){
    nav.sim=false;
    nav.watch=navigator.geolocation.watchPosition(p=>update({lng:p.coords.longitude,lat:p.coords.latitude,heading:p.coords.heading,speed:p.coords.speed}),
      ()=>toast('Lost GPS signal. Keep going; it will reconnect.'),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
    say(steps[0].text);
  }else{
    toast('Previewing the trip in 3D, because you’re not at the start point.',4500);say('Starting preview. '+steps[0].text);
    nav.timer=setInterval(()=>{nav.simD+=SPEED[mode]*4;const p=pointAt(coords,cum,nav.simD);update({lng:p.lng,lat:p.lat,heading:p.bearing,speed:SPEED[mode]});},1000);
  }
}
function update(pos){
  if(!nav)return;const {coords,cum,steps}=nav,total=cum[cum.length-1];
  const sn=snap(coords,cum,pos,Math.max(1,nav.seg-3),Math.min(coords.length,nav.seg+60));
  const s2=sn.dist>80?snap(coords,cum,pos,1,coords.length):sn;
  nav.seg=s2.i;const along=s2.along,rem=Math.max(0,total-along);
  const heading=(pos.heading!=null&&!isNaN(pos.heading)&&(pos.speed||0)>1)?pos.heading:pointAt(coords,cum,along+5).bearing;
  nav.lastHeading=heading;nav.puck.setLngLat([pos.lng,pos.lat]).setRotation(heading);
  const zoom={walk:18.2,bike:17.8,train:15.5}[nav.mode]||17.4;
  map.easeTo({center:[pos.lng,pos.lat],bearing:heading,pitch:64,zoom,duration:950,easing:t=>t,padding:{top:innerHeight*.42,bottom:90,left:0,right:0}});
  const next=steps.find(s=>s.at>along+8)||steps[steps.length-1],dn=Math.max(0,next.at-along);
  $('#navArrow').textContent=next.arrow;$('#navDist').textContent=dn<1000?Math.round(dn/10)*10+' m':(dn/1000).toFixed(1)+' km';$('#navIns').textContent=next.text;
  const key=steps.indexOf(next);
  if(dn<450&&dn>250&&!nav.spoken.has(key+'f')){nav.spoken.add(key+'f');say(`In ${Math.round(dn/50)*50} metres, ${next.text}`);}
  if(dn<=60&&!nav.spoken.has(key+'n')){nav.spoken.add(key+'n');say(next.text);}
  const spd=(pos.speed!=null&&!isNaN(pos.speed))?pos.speed:SPEED[nav.mode];
  $('#navSpeed').innerHTML=`${Math.round(spd*3.6)}<small>km/h</small>`;
  const mins=rem/SPEED[nav.mode]/60;
  $('#navEta').textContent=lagosTime(new Date(Date.now()+mins*60000))+' arrival';
  $('#navRem').textContent=`${fmtMin(mins)}, ${fmtKm(rem/1000)} to ${nav.dest.name}`;
  const ahead=nav.reports.find(x=>x.at>along&&x.at-along<500&&!nav.spoken.has('r'+x.id));
  if(ahead){nav.spoken.add('r'+ahead.id);const [l,i]=REPORTS[ahead.type];say(`${l} reported ahead`);
    const a=$('#navAlert');a.textContent=`${i} ${l} reported ahead`;a.hidden=false;setTimeout(()=>a.hidden=true,6000);}
  if(!nav.sim){nav.off=s2.dist>60?nav.off+1:0;if(nav.off>=3){nav.off=0;reroute(pos);}}
  if(rem<25){say('You have arrived at '+nav.dest.name);toast('You’ve arrived.');endNav();}
}
async function reroute(pos){
  if(nav.rerouting||!['drive','keke','okada','walk','bike'].includes(nav.mode))return;nav.rerouting=true;say('Rerouting');
  const prof=nav.mode==='walk'?'foot':nav.mode==='bike'?'bike':'driving';
  const r=await roadRoute(prof,pos,nav.dest);
  if(r&&nav){nav.coords=r.coords;nav.cum=cumDist(r.coords);nav.steps=r.steps;let j=0;
    nav.steps.forEach(s=>{const sn=snap(nav.coords,nav.cum,P(s.loc),j,nav.coords.length);s.at=sn.along;j=Math.max(1,sn.i-1);});
    nav.seg=1;nav.spoken=new Set();setFC('route',fc([{type:'Feature',properties:{type:'ride',color:'#12805A'},geometry:{type:'LineString',coordinates:r.coords}}]));}
  if(nav)nav.rerouting=false;
}
function endNav(){
  if(!nav)return;clearInterval(nav.timer);if(nav.watch!=null)navigator.geolocation.clearWatch(nav.watch);nav.puck.remove();nav=null;
  if(window.speechSynthesis)speechSynthesis.cancel();
  $('#navTop').hidden=$('#navBot').hidden=$('#navAlert').hidden=true;$('#top').hidden=$('#fabs').hidden=false;
  if(current)renderResults();map.easeTo({pitch:0,bearing:0,padding:{top:0,bottom:0,left:0,right:0},duration:600});
}
$('#navEnd').onclick=endNav;
$('#navMute').onclick=()=>{muted=!muted;$('#navMute').textContent=muted?'🔇':'🔊';if(muted&&window.speechSynthesis)speechSynthesis.cancel();};

/* ======================= Road reports (Waze-style, saved on this device) ======================= */
const RKEY='ona.reports.v1';
function loadReports(){let a=[];try{a=JSON.parse(localStorage.getItem(RKEY)||'[]');}catch(e){}
  const now=Date.now();return a.filter(r=>REPORTS[r.type]&&now-r.t<REPORTS[r.type][2]*60000);}
function saveReports(a){try{localStorage.setItem(RKEY,JSON.stringify(a));}catch(e){}}
let repMarkers=[];
function ago(t){const m=(Date.now()-t)/60000;return m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago';}
function renderReports(){
  repMarkers.forEach(m=>m.remove());
  repMarkers=loadReports().map(r=>{const [l,i]=REPORTS[r.type],el=document.createElement('div');el.className='rep';el.textContent=i;
    if(!$('#lyReports').checked)el.style.display='none';
    el.onclick=ev=>{ev.stopPropagation();new maplibregl.Popup().setLngLat([r.lng,r.lat]).setHTML(`<div class="pop"><b>${i} ${l}</b>Reported ${ago(r.t)}<br>
      <button onclick="confirmReport('${r.id}')">Still there</button><button onclick="removeReport('${r.id}')">It’s gone</button></div>`).addTo(map);};
    return new maplibregl.Marker({element:el}).setLngLat([r.lng,r.lat]).addTo(map);});
}
window.confirmReport=id=>{const a=loadReports();const r=a.find(x=>x.id===id);if(r)r.t=Date.now();saveReports(a);renderReports();toast('Thanks. Report confirmed.');document.querySelectorAll('.maplibregl-popup').forEach(p=>p.remove());};
window.removeReport=id=>{saveReports(loadReports().filter(x=>x.id!==id));renderReports();toast('Report removed.');document.querySelectorAll('.maplibregl-popup').forEach(p=>p.remove());};
$('#rgrid').innerHTML=Object.entries(REPORTS).map(([k,[l,i]])=>`<button data-type="${k}"><span>${i}</span>${l}</button>`).join('');
const openRep=()=>{$('#repModal').hidden=false;};
$('#repBtn').onclick=$('#navRep').onclick=openRep;
$('#repClose').onclick=()=>$('#repModal').hidden=true;
$('#rgrid').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;$('#repModal').hidden=true;
  let at=null,where='at your location';
  if(nav){const ll=nav.puck.getLngLat();at={lat:ll.lat,lng:ll.lng};}
  else{try{const p=await myLocation();if(inNigeria(p))at=p;}catch(err){}
    if(!at){const c=map.getCenter();at={lat:c.lat,lng:c.lng};where='at the centre of the map';}}
  const a=loadReports();a.push({id:Math.random().toString(36).slice(2,10),type:b.dataset.type,lat:at.lat,lng:at.lng,t:Date.now()});saveReports(a);renderReports();
  toast(`${REPORTS[b.dataset.type][0]} reported ${where}.`);
});

/* ======================= Voice input (Nigerian English and Pidgin phrasing) ======================= */
function parseTrip(raw){
  const t=raw.toLowerCase().replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim(),HERE=/^(here|my location|where i dey|where i am|current location)$/;
  const dest='(?:to|i (?:wan|want to|wanna) go(?: to)?|wan go(?: to)?|going to|enter)';
  let m=t.match(new RegExp(`(?:from|i dey(?: for)?|i am at|i'm at|i am in|i'm in)\\s+(.+?)\\s+(?:and\\s+)?${dest}\\s+(.+)$`));
  if(m)return {from:HERE.test(m[1])?'':m[1],to:m[2]};
  m=t.match(/(?:take me to|carry me go|i (?:wan|want to|wanna) go(?: to)?|go to|directions to|how (?:i|do i|can i) (?:fit )?(?:go|get to|reach))\s+(.+)$/);
  if(m)return {from:'',to:m[1]};
  return {from:null,to:t};
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('#micBtn').onclick=()=>{
  if(!SR){toast('Voice input isn’t supported in this browser. Try Chrome, or type your trip.');return;}
  rec=new SR();rec.lang=$('#vlang').value;rec.interimResults=true;
  $('#voice').hidden=false;$('#vtext').textContent='Listening…';let finalText='';
  rec.onresult=e=>{let s='';for(const r of e.results){s+=r[0].transcript;if(r.isFinal)finalText=s;}$('#vtext').textContent='“'+s+'”';};
  rec.onerror=e=>{$('#vtext').textContent=e.error==='not-allowed'?'Microphone permission is off. Allow it in your browser settings.':'Didn’t catch that. Tap the mic and try again.';};
  rec.onend=()=>{if(!finalText){setTimeout(()=>$('#voice').hidden=true,1600);return;}
    const p=parseTrip(finalText);$('#voice').hidden=true;
    if(p.from!==null){$('#from').value=p.from;delete $('#from').dataset.lat;}
    $('#to').value=p.to;delete $('#to').dataset.lat;findRoutes();};
  rec.start();
};
$('#vstop').onclick=()=>{rec&&rec.stop();};
$('#vlang').onchange=()=>{if(rec){rec.abort();$('#micBtn').click();}};
</script>
