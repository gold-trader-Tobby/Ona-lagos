<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ọ̀nà">
<title>Ọ̀nà — Lagos maps, navigation and transit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* ======== Settings you can fill in later ======== */
:root{
  --green:#0E3B2E; --leaf:#12805A; --danfo:#F2B705; --red:#D6262C;
  --surface:#FFFFFF; --glass:rgba(255,255,255,.9); --surface2:#EEF3F0; --text:#0E3B2E; --muted:#5A6A62; --line:#D7E0DA;
  --btn-bg:#0E3B2E; --btn-fg:#FFFFFF; --shadow:0 8px 28px rgba(14,59,46,.22);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --surface:#10231C; --glass:rgba(16,35,28,.9); --surface2:#1A372D; --text:#E8F1EC; --muted:#9FB5AA; --line:#2B4A3E;
  --btn-bg:#F2B705; --btn-fg:#0E3B2E; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0E1714;color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4}
#map{position:fixed;inset:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--danfo);outline-offset:2px}
[hidden]{display:none!important}
.logo{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;font-size:24px;letter-spacing:-.02em}
h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;margin:0}
h2{font-size:20px;line-height:1.2}
h3{font-size:15px;color:var(--muted);margin:14px 2px 6px}

/* Floating controls */
.ctrls{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:6;display:grid;gap:8px}
.cbtn{width:46px;height:46px;border-radius:14px;border:0;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow);font-size:19px;display:grid;place-items:center}
.cbtn.report{background:var(--danfo);color:#0E3B2E;font-weight:800;font-size:22px}
.layers{position:fixed;z-index:7;right:64px;top:calc(env(safe-area-inset-top,0px) + 10px);width:260px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:18px;box-shadow:var(--shadow);padding:8px 12px}
.layers label{display:flex;gap:10px;align-items:center;padding:7px 2px}
.layers select{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:4px 6px}
.layers .btn2{width:100%;margin-top:6px}

/* Bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;height:92vh;height:92dvh;max-width:560px;margin:0 auto;
  background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);
  transform:translateY(calc(100% - var(--snap,180px)));transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.dragging{transition:none}
.grab{padding:9px 0 6px;touch-action:none;cursor:grab;flex:none}
.grab span{display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-body{overflow:auto;padding:2px 14px calc(env(safe-area-inset-bottom,0px) + 20px);flex:1;overscroll-behavior:contain}
.hrow{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.hrow .status{flex:1;color:var(--muted);font-size:13px;text-align:right}
.pillrow{display:flex;gap:8px}
.pill{flex:1;display:flex;align-items:center;gap:10px;border:0;background:var(--surface2);border-radius:14px;height:50px;padding:0 14px;font-size:17px;color:var(--muted);text-align:left}
.mic{border:0;width:50px;height:50px;border-radius:14px;background:var(--btn-bg);color:var(--btn-fg);display:grid;place-items:center;flex:none}
.mic svg{width:22px;height:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--leaf);background:var(--surface2)}
.saved{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:0;background:var(--surface2);border-radius:14px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center}
.tile .e{font-size:22px}
.tile small{display:block;color:var(--muted);font-size:12.5px}
.plist{list-style:none;padding:0;margin:0}
.plist li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.plist li .e{font-size:20px;width:26px;text-align:center}
.plist li span{flex:1;min-width:0}
.plist small{display:block;color:var(--muted)}
.plist button.go-sm{border:0;border-radius:10px;padding:7px 12px;background:var(--btn-bg);color:var(--btn-fg);font-weight:700}
.rowbtn{all:unset;display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;min-width:0}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.shead h2{flex:1}
.icon-btn{border:0;background:var(--surface2);border-radius:12px;min-width:40px;height:40px;display:grid;place-items:center;font-size:18px;padding:0 10px}
.fields{display:grid;gap:6px;position:relative;margin-bottom:8px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:0 4px 0 14px}
.field input{flex:1;border:0;background:transparent;height:48px;min-width:0;font-size:16px;outline:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.o{border:3px solid var(--leaf)}
.dot.d{background:var(--red)}
.swap{position:absolute;right:62px;top:36px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;z-index:1}
.go{width:100%;border:0;border-radius:14px;height:50px;background:var(--btn-bg);color:var(--btn-fg);font-weight:700;font-size:17px}
.btn2{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.sugg{list-style:none;margin:8px 0 0;padding:0}
.sugg button{width:100%;text-align:left;border:0;background:transparent;padding:11px 4px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.sugg small{display:block;color:var(--muted)}
.mrow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.mrow::-webkit-scrollbar{display:none}
.mchip{flex:none;width:78px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 4px;display:grid;justify-items:center;gap:1px}
.mchip .e{font-size:21px;line-height:1.1}
.mchip b{font-size:13.5px}
.mchip small{font-size:11.5px;color:var(--muted)}
.mchip[aria-pressed="true"]{background:var(--danfo);border-color:#0E3B2E;color:#0E3B2E}
.mchip[aria-pressed="true"] small{color:#0E3B2E}
.mchip.dim{opacity:.5}
.sum{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 2px 10px;gap:10px}
.sum .big{font-family:"Bricolage Grotesque",Georgia,serif;font-size:30px;font-weight:800;line-height:1;display:block}
.sum span{color:var(--muted);font-size:14px}
.sum .meta{text-align:right;font-size:14px;color:var(--muted)}
.dest{margin:12px 0 4px}
.aerial{position:relative;border-radius:16px;overflow:hidden;background:var(--surface2);aspect-ratio:16/7}
.aerial img{width:100%;height:100%;object-fit:cover;display:block}
.aerial .tag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:8px}
.dpin{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.dact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pics{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.pics a{flex:none;width:140px;aspect-ratio:4/3;border-radius:12px;overflow:hidden}
.pics img{width:100%;height:100%;object-fit:cover}
.steps{margin:8px 2px 4px;padding-left:20px}
.steps li{margin:5px 0}
.note{font-size:13.5px;background:var(--surface2);border-left:4px solid var(--danfo);border-radius:10px;padding:9px 11px;margin:8px 0}
.note.warn{border-left-color:var(--red)}
.note.lit{border-left-color:#E9C300}

/* Navigation */
.navtop{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:7;max-width:560px;margin:0 auto;
  background:var(--leaf);color:#fff;border-radius:20px;box-shadow:var(--shadow);padding:12px 16px;display:flex;gap:14px;align-items:center}
.arrow{font-size:44px;line-height:1;width:50px;text-align:center}
.navtop .dist{font-family:"Bricolage Grotesque",Georgia,serif;font-size:28px;font-weight:800;line-height:1}
.navtop .ins{font-size:17px;margin-top:3px}
.navchips{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:7;display:flex;gap:8px;justify-content:center;pointer-events:none}
.nchip{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--text);font-weight:700;border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);white-space:nowrap}
.nchip.alert{background:var(--danfo);color:#0E3B2E}
.navbot{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:7;max-width:560px;margin:0 auto;
  background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:20px;box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:10px}
.eta{flex:1;min-width:0}
.eta b{font-family:"Bricolage Grotesque",Georgia,serif;font-size:22px;display:block;line-height:1.1}
.eta span{font-size:13px;color:var(--muted)}
.speed{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px;line-height:1;flex:none}
.speed small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.end{border:0;border-radius:12px;height:44px;padding:0 16px;background:var(--red);color:#fff;font-weight:700}
.puck{width:34px;height:34px}
.puck svg{width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}

.modal{position:fixed;inset:0;z-index:9;background:rgba(14,30,24,.55);display:grid;place-items:end center;padding:10px}
.modal .card{width:min(540px,100%);background:var(--surface);border-radius:22px;padding:14px;margin-bottom:env(safe-area-inset-bottom,0px)}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.rgrid button{border:0;background:var(--surface2);border-radius:14px;padding:10px 2px;display:grid;gap:4px;font-size:12px;font-weight:700}
.rgrid button span{font-size:26px}
.rep{font-size:21px;width:36px;height:36px;border-radius:50%;background:#fff;border:2.5px solid #0E3B2E;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.poi{font-size:17px;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--leaf);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}

.voice{position:fixed;inset:0;z-index:9;background:rgba(14,59,46,.75);display:grid;place-items:center;padding:20px}
.voice .card{text-align:center;width:min(420px,100%);background:var(--surface);border-radius:22px;padding:16px}
.pulse{width:84px;height:84px;margin:10px auto 14px;border-radius:50%;background:var(--danfo);display:grid;place-items:center;animation:p 1.4s infinite}
.pulse svg{width:38px;height:38px;color:#0E3B2E}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(242,183,5,.6)}100%{box-shadow:0 0 0 26px rgba(242,183,5,0)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}.sheet{transition:none}}
#vtext{font-size:18px;min-height:52px;margin:0 0 10px}
.vrow{display:flex;gap:8px;justify-content:center}
.vrow select,.vrow button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:10;background:var(--green);color:#fff;padding:10px 14px;border-radius:14px;max-width:min(90vw,420px);font-size:14px;text-align:center;box-shadow:var(--shadow)}
.pin{width:22px;height:22px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pin.o{background:var(--leaf)} .pin.d{background:var(--red)}
.maplibregl-popup-content{font-family:inherit;border-radius:14px;padding:10px 12px;color:#0E3B2E}
.pop b{display:block;margin-bottom:4px}
.pop button,.pop a{display:inline-block;margin:6px 6px 0 0;border:0;border-radius:8px;padding:6px 9px;background:#EEF3F0;font-weight:700;font-size:13px;color:#0E3B2E;text-decoration:none}
.maplibregl-ctrl-top-left{top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="map" aria-label="Map of Lagos"></div>

<div class="ctrls" id="ctrls">
  <button class="cbtn" id="layersBtn" aria-label="Map layers" aria-expanded="false">◱</button>
  <button class="cbtn" id="meBtn" aria-label="Show my location">➤</button>
  <button class="cbtn report" id="repBtn" aria-label="Report something on the road">!</button>
</div>

<aside class="layers" id="layers" hidden>
  <label><input type="checkbox" id="lySat"> Satellite imagery</label>
  <label><input type="checkbox" id="ly3d" checked> 3D buildings</label>
  <label><input type="checkbox" id="lyLights" checked> Street and traffic lights</label>
  <label><input type="checkbox" id="lyReports" checked> Road reports</label>
  <label><input type="checkbox" id="lyTransit" checked> Rail, BRT and bus parks</label>
  <label>Map look <select id="theme"><option value="auto">Auto (Lagos time)</option><option value="day">Day</option><option value="night">Night</option></select></label>
  <button class="btn2" id="osh3d">Explore Oshodi loading bays in 3D</button>
</aside>

<section class="sheet" id="sheet" aria-label="Search and directions">
  <div class="grab" id="grab"><span></span></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="navtop" id="navTop" hidden><div class="arrow" id="navArrow">↑</div><div><div class="dist" id="navDist"></div><div class="ins" id="navIns"></div></div></div>
<div class="navchips" id="navChips" hidden><span class="nchip" id="sigChip" hidden></span><span class="nchip alert" id="alertChip" hidden></span></div>
<div class="navbot" id="navBot" hidden>
  <div class="speed" id="navSpeed">0<small>km/h</small></div>
  <div class="eta"><b id="navEta"></b><span id="navRem"></span></div>
  <button class="icon-btn" id="navMute" aria-label="Mute voice guidance">🔊</button>
  <button class="icon-btn" id="navRep" aria-label="Report">!</button>
  <button class="end" id="navEnd">End</button>
</div>

<div class="modal" id="repModal" hidden>
  <div class="card">
    <div class="shead"><h2>What do you see?</h2><button class="icon-btn" id="repClose" aria-label="Close">✕</button></div>
    <div class="rgrid" id="rgrid"></div>
    <div class="note">Reports are saved on this device for now. Sharing them live with other drivers needs a backend.</div>
  </div>
</div>

<div class="voice" id="voice" hidden>
  <div class="card">
    <div class="pulse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
    <p id="vtext">Say “From Ikeja to Yaba” or “I dey Oshodi, I wan go CMS”</p>
    <div class="vrow">
      <select id="vlang" aria-label="Speech language"><option value="en-NG">English (Nigeria)</option><option value="en-GB">English (UK)</option><option value="en-US">English (US)</option></select>
      <button id="vstop">Done</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ======================= Settings ======================= */
// Free key from https://www.mapillary.com/dashboard/developers (Client Token). Adds real street photos at destinations.
const MAPILLARY_TOKEN='';
// Live traffic-signal timing feed (SPaT). Lagos has no public feed yet; when one exists, put its URL here.
// Expected reply for GET ?lat=..&lng=.. : {"state":"red"|"amber"|"green","remaining":seconds}
const SIGNAL_FEED_URL='';

/* ======================= Seed data (approximate — verify with OSM / LAMATA / field visits) ======================= */
const S=(id,name,lat,lng,kind,extra={})=>({id,name,lat,lng,kind,aka:[],...extra});
const STOPS=[
  S('rl-agbado','Agbado station',6.6747,3.3207,'rail',{line:'red',aka:['agbado']}),
  S('rl-iju','Iju station',6.6580,3.3290,'rail',{line:'red',aka:['iju']}),
  S('rl-agege','Agege station',6.6250,3.3240,'rail',{line:'red',aka:['agege train']}),
  S('rl-ikeja','Ikeja station',6.5985,3.3445,'rail',{line:'red',aka:['ikeja train']}),
  S('rl-oshodi','Oshodi station',6.5560,3.3460,'rail',{line:'red',aka:['oshodi train']}),
  S('rl-mushin','Mushin station',6.5300,3.3550,'rail',{line:'red',aka:['mushin']}),
  S('rl-yaba','Yaba station',6.5090,3.3790,'rail',{line:'red',aka:['yaba train']}),
  S('rl-oyingbo','Oyingbo station',6.4880,3.3860,'rail',{line:'red',aka:['oyingbo','ebute metta']}),
  S('bl-marina','Marina station',6.4505,3.3925,'rail',{line:'blue',aka:['marina']}),
  S('bl-nt','National Theatre station',6.4770,3.3690,'rail',{line:'blue',aka:['national theatre']}),
  S('bl-iganmu','Iganmu station',6.4710,3.3560,'rail',{line:'blue',aka:['iganmu']}),
  S('bl-alaba','Suru-Alaba station',6.4660,3.3300,'rail',{line:'blue',aka:['suru alaba']}),
  S('bl-mile2','Mile 2 station',6.4610,3.3150,'rail',{line:'blue',aka:['mile 2 train']}),
  S('b1-ikorodu','Ikorodu BRT terminal',6.6150,3.5070,'brt',{aka:['ikorodu brt']}),
  S('b1-mile12','Mile 12 BRT',6.6085,3.3955,'brt'),
  S('b1-ketu','Ketu BRT',6.5970,3.3880,'brt',{aka:['ketu']}),
  S('b1-ojota','Ojota BRT',6.5850,3.3800,'brt'),
  S('b1-maryland','Maryland BRT',6.5720,3.3660,'brt',{aka:['maryland']}),
  S('b1-onipanu','Onipanu BRT',6.5400,3.3660,'brt',{aka:['onipanu']}),
  S('b1-fadeyi','Fadeyi BRT',6.5300,3.3720,'brt',{aka:['fadeyi']}),
  S('b1-jibowu','Jibowu BRT',6.5180,3.3770,'brt',{aka:['jibowu']}),
  S('b1-costain','Costain BRT',6.4935,3.3690,'brt'),
  S('b1-cms','CMS BRT',6.4520,3.3890,'brt'),
  S('b1-tbs','TBS BRT terminal',6.4440,3.4000,'brt',{aka:['tbs','tafawa balewa square']}),
  S('b2-oshodi','Oshodi BRT',6.5530,3.3430,'brt'),
  S('b2-along','Ikeja Along BRT',6.6070,3.3230,'brt',{aka:['ikeja along']}),
  S('b2-dopemu','Dopemu BRT',6.6150,3.3120,'brt',{aka:['dopemu']}),
  S('b2-ipaja','Iyana Ipaja BRT',6.6130,3.2960,'brt',{aka:['iyana ipaja']}),
  S('b2-abule','Abule Egba BRT',6.6470,3.3010,'brt',{aka:['abule egba']}),

const $=s=>document.querySelector(s);
const toRad=d=>d*Math.PI/180;
function km(a,b){const R=6371,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const P=c=>({lng:c[0],lat:c[1]});
const naira=n=>'₦'+(Math.round(n/50)*50).toLocaleString('en-NG');

const fmtMin=m=>m<60?Math.max(1,Math.round(m))+' min':Math.floor(m/60)+' h '+Math.round(m%60)+' min';
const fmtKm=k=>k<1?Math.round(k*1000/10)*10+' m':k.toFixed(1)+' km';
const inZone=(p,z)=>z.some(([lat,lng,r])=>km(p,{lat,lng})<=r);

function bearing(a,b){const y=Math.sin(toRad(b.lng-a.lng))*Math.cos(toRad(b.lat)),x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lng-a.lng));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;}
function lagosClock(){
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Lagos',hour:'2-digit',minute:'2-digit',weekday:'short',month:'numeric',hour12:false}).formatToParts(new Date()).map(p=>[p.type,p.value]));
  const h=+parts.hour%24,wk=!['Sat','Sun'].includes(parts.weekday);
  return {label:`${parts.weekday} ${parts.hour}:${parts.minute} in Lagos`,h,peak:wk&&((h>=6&&h<10)||(h>=16&&h<21)),rainy:+parts.month>=4&&+parts.month<=10,night:h>=19||h<6};
}

  try{const r=await fetch(url,{...opt,signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(t);}}

/* Overpass (OpenStreetMap live query) with several public mirrors — the main server is often busy */
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
let opBest=0;
async function overpass(q,ms=14000){
  let err;
  for(let n=0;n<OVERPASS.length;n++){const i=(opBest+n)%OVERPASS.length;
    try{const j=await getJSON(OVERPASS[i]+'?data='+encodeURIComponent(q),{},ms);opBest=i;return j;}catch(e){err=e;}}
  throw err||new Error('overpass');
}

/* Day / night */
function isNight(){const t=$('#theme').value;return t==='night'||(t==='auto'&&lagosClock().night);}
function darken(){
  for(const l of map.getStyle().layers){
    if(CUSTOM.has(l.id))continue;const sl=l['source-layer']||'';
    try{
      if(l.type==='background')map.setPaintProperty(l.id,'background-color','#0E1714');
      else if(l.type==='fill')map.setPaintProperty(l.id,'fill-color',sl==='water'?'#0A1F2C':(sl==='park'||sl==='landcover')?'#11231B':'#141E1B');
      else if(l.type==='line'){map.setPaintProperty(l.id,'line-color',sl==='waterway'?'#0A1F2C':/casing/.test(l.id)?'#0E1714':sl==='transportation'?(/motorway|trunk|primary/.test(l.id)?'#8A7232':'#3C4A45'):'#26332F');}
      else if(l.type==='symbol'){map.setPaintProperty(l.id,'text-color','#D7E2DC');map.setPaintProperty(l.id,'text-halo-color','#0E1714');}
      else if(l.type==='fill-extrusion')map.setPaintProperty(l.id,'fill-extrusion-color','#2E3D37');
    }catch(e){}
  }
  darkened=true;
}
function applyTheme(){const n=isNight();document.documentElement.dataset.theme=n?'dark':'light';
  if(!map.isStyleLoaded())return;if(n&&!darkened)darken();else if(!n&&darkened)map.setStyle(STYLE_URL);}
$('#theme').onchange=applyTheme;setInterval(applyTheme,5*60*1000);

const lightTiles=new Set();let lightHint=false;
function addLightElements(els){
  for(const e of els){
    const hw=e.tags&&e.tags.highway;
    if(e.type==='node'&&e.lat!=null){
      if(hw==='traffic_signals')lightItems.set('s'+e.id,{type:'Feature',properties:{k:'sig',id:e.id},geometry:{type:'Point',coordinates:[e.lon,e.lat]}});
      else lightItems.set('n'+e.id,{type:'Feature',properties:{k:'lamp'},geometry:{type:'Point',coordinates:[e.lon,e.lat]}});
    }else if(e.type==='way'&&e.geometry)lightItems.set('w'+e.id,{type:'Feature',properties:{k:'way',lit:(e.tags&&e.tags.lit)||'yes'},geometry:{type:'LineString',coordinates:e.geometry.map(g=>[g.lon,g.lat])}});
  }
  const all=[...lightItems.values()];
  setFC('lamps',fc(all.filter(f=>f.properties.k==='lamp')));
  setFC('signals',fc(all.filter(f=>f.properties.k==='sig')));
  setFC('lit',fc(all.filter(f=>f.properties.k==='way')));
}
async function loadLights(){
  if(!$('#lyLights').checked||nav)return;
  if(map.getZoom()<14.5){if(!lightHint&&map.getZoom()>12){lightHint=true;toast('Zoom in closer to see street lights and traffic lights.');}return;}
  const c=map.getCenter(),key=Math.floor(c.lat*80)+':'+Math.floor(c.lng*80);
  if(lightTiles.has(key))return;lightTiles.add(key);
  const s=Math.floor(c.lat*80)/80,w=Math.floor(c.lng*80)/80,bb=`${s-0.006},${w-0.006},${s+0.0185},${w+0.0185}`;
  try{const j=await overpass(`[out:json][timeout:25];(node["highway"~"^(street_lamp|traffic_signals)$"](${bb});way["highway"]["lit"](${bb}););out geom;`);addLightElements(j.elements||[]);}

}
async function routeExtras(coords){
  let s=90,w=180,n=-90,e=-180;for(const [x,y] of coords){s=Math.min(s,y);n=Math.max(n,y);w=Math.min(w,x);e=Math.max(e,x);}

  const j=await overpass(`[out:json][timeout:25];node["highway"~"^(street_lamp|traffic_signals)$"](${s-.001},${w-.001},${n+.001},${e+.001});out;`,20000);
  const els=j.elements||[];addLightElements(els);
  const lamps=els.filter(x=>x.tags&&x.tags.highway==='street_lamp'),sigs=els.filter(x=>x.tags&&x.tags.highway==='traffic_signals');
  const grid=new Map();for(const l of lamps){const k=Math.round(l.lat/.0005)+':'+Math.round(l.lon/.0005);(grid.get(k)||grid.set(k,[]).get(k)).push(l);}
  const cum=cumDist(coords),len=cum[cum.length-1];let total=0,lit=0;
  for(let d=0;d<len;d+=30){const p=pointAt(coords,cum,d);total++;const gy=Math.round(p.lat/.0005),gx=Math.round(p.lng/.0005);let hit=false;
    for(let dy=-1;dy<=1&&!hit;dy++)for(let dx=-1;dx<=1&&!hit;dx++)for(const l of grid.get((gy+dy)+':'+(gx+dx))||[])if(km(p,{lat:l.lat,lng:l.lon})<.04){hit=true;break;}
    if(hit)lit++;}
  const pct=total?lit/total:0;
  const onRoute=sigs.map(x=>({id:x.id,lat:x.lat,lng:x.lon,...snap(coords,cum,{lat:x.lat,lng:x.lon},1,coords.length)})).filter(x=>x.dist<25).map(x=>({id:x.id,lat:x.lat,lng:x.lng,at:x.along}));

}

const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(bus ?stop|park|motor park|station|garage|junction|side)\b/g,' ').replace(/\s+/g,' ').trim();
function gazMatches(q){
  const n=norm(q);if(!n)return [];const rank={park:.3,place:.2,brt:.1,rail:0},out=[];
  for(const s of STOPS){let bs=0;
    for(const name of [s.name,...s.aka]){const m=norm(name);let sc=0;
      if(m===n)sc=3;else if(m.startsWith(n)||(n.length>3&&(m.includes(n)||n.includes(m))))sc=2;
      else{const a=n.split(' '),b=m.split(' ');sc=a.filter(w=>w.length>2&&b.includes(w)).length/Math.max(a.length,b.length);}
      bs=Math.max(bs,sc?sc+rank[s.kind]:0);}
    if(bs>=.75)out.push({s,bs});}
  return out.sort((a,b)=>b.bs-a.bs).slice(0,4).map(x=>({lat:x.s.lat,lng:x.s.lng,name:x.s.name,icon:{park:'🚌',brt:'🚍',rail:'🚆',place:'📍'}[x.s.kind],sub:{park:'Bus park',brt:'BRT stop',rail:'Train station',place:'Lagos'}[x.s.kind]}));
}

  return (j.features||[]).filter(f=>!f.properties.countrycode||f.properties.countrycode==='NG').map(f=>{const p=f.properties;
    return {lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],icon:'📍',name:p.name||[p.housenumber,p.street].filter(Boolean).join(' ')||'Place',
      sub:[p.street&&p.name?p.street:null,p.district||p.locality,p.city||p.county].filter(Boolean).join(', ')};});
}
async function geocode(q){

const nearbyCache=new Map();
async function nearby(k,ctr){
  const [label,,q,ptags,pword]=CATS[k],key=k+Math.round(ctr.lat*200)+':'+Math.round(ctr.lng*200);
  if(nearbyCache.has(key))return nearbyCache.get(key);
  let items=[];
  for(const r of [3000,8000]){
    try{const j=await overpass(`[out:json][timeout:20];${q}(around:${r},${ctr.lat},${ctr.lng});out center 60;`);
      items=(j.elements||[]).map(x=>({lat:x.lat??x.center.lat,lng:x.lon??x.center.lon,name:(x.tags&&(x.tags.name||x.tags.brand||x.tags.operator))||label,
        sub:x.tags&&[x.tags['addr:street'],x.tags.opening_hours?'Hours: '+x.tags.opening_hours:null].filter(Boolean).join(', ')}));}
    catch(e){break;}
    if(items.length>=3)break;}
  if(!items.length){
    try{items=(await photon(pword,ptags.map(t=>'&osm_tag='+t).join('')+`&lat=${ctr.lat}&lon=${ctr.lng}`)).map(x=>({...x,name:x.name}));}catch(e){}
  }
  items.forEach(it=>it.d=km(ctr,it));items=items.filter(it=>it.d<15).sort((a,b)=>a.d-b.d).slice(0,30);

}

function toLL(p,[x,y]){const r=toRad(p.rot||0),xr=x*Math.cos(r)-y*Math.sin(r),yr=x*Math.sin(r)+y*Math.cos(r);return [p.lng+xr/(111320*Math.cos(toRad(p.lat))),p.lat+yr/110540];}
const rect=(cx,cy,w,h)=>[[cx-w/2,cy-h/2],[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2],[cx-w/2,cy-h/2]];
function buildPark(p){
  const polys=[],labels=[],add=(ring,props)=>polys.push({type:'Feature',properties:props,geometry:{type:'Polygon',coordinates:[ring.map(q=>toLL(p,q))]}});
  const bays=p.bays||[],perRow=6,rows=Math.ceil(bays.length/perRow),pitch=10,bayL=14,gap=28,width=perRow*pitch+16;
  add(rect(0,(rows-1)*gap/2,width+12,rows*gap+44),{kind:'apron',h:.12,b:0,c:'#9AA39E'});
  add(rect(0,-26,width*.75,12),{kind:'terminal',h:9,b:0,c:'#ECE6D6'});
  add(rect(-width/2-2,(rows-1)*gap/2,4,rows*gap),{kind:'kiosks',h:3,b:0,c:'#C0533A'});
  for(let r=0;r<rows;r++){add(rect(0,r*gap,width,bayL+6),{kind:'canopy',h:6.4,b:5.8,c:'#BFCAC4'});if(r<rows-1)add(rect(0,r*gap+gap/2,width,4),{kind:'walkway',h:.3,b:0,c:'#E5E1D6'});}
  bays.forEach((dest,i)=>{const r=Math.floor(i/perRow),k=i%perRow,x=(k-(perRow-1)/2)*pitch,y=r*gap;
    add(rect(x,y,4.5,bayL),{kind:'bay',h:.25,b:0,c:'#F5F1E6'});add(rect(x,y+1,2.3,5.8),{kind:'bus',h:2.6,b:.35,c:['#F2B705','#E9A800','#F7C948'][i%3]});
    labels.push({type:'Feature',properties:{label:`${i+1} ${dest}`},geometry:{type:'Point',coordinates:toLL(p,[x,y-bayL/2-3])}});});
  return {polys,labels};
}

const OSRM={driving:'https://router.project-osrm.org/route/v1/driving/',foot:'https://routing.openstreetmap.de/routed-foot/route/v1/driving/',bike:'https://routing.openstreetmap.de/routed-bike/route/v1/driving/'};
const routeCache=new Map();
async function roadRoute(profile,a,b){
  const key=[profile,a.lng,a.lat,b.lng,b.lat].map(x=>typeof x==='number'?x.toFixed(5):x).join();
  if(routeCache.has(key))return routeCache.get(key);
  try{const j=await getJSON(`${OSRM[profile]}${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&steps=true`,{},10000);
    if(j.routes&&j.routes[0]){const r=j.routes[0];
      const out={coords:r.geometry.coordinates,km:r.distance/1000,steps:r.legs[0].steps.map(s=>({text:instr(s),arrow:arrowFor(s),loc:s.maneuver.location}))};
      routeCache.set(key,out);return out;}}catch(e){}
  return null;
}
const DIRS=['north','north-east','east','south-east','south','south-west','west','north-west'];
function instr(st){const m=st.maneuver,t=m.type,mod=m.modifier||'',road=st.name?` onto ${st.name}`:'';
  if(t==='depart')return `Head ${DIRS[Math.round((m.bearing_after||0)/45)%8]}${st.name?' on '+st.name:''}`;
  if(t==='arrive')return 'You have arrived';
  if(t==='roundabout'||t==='rotary')return `At the roundabout, take exit ${m.exit||1}${road}`;
  if(t==='merge')return `Merge${road}`;if(t==='on ramp')return `Take the ramp${road}`;if(t==='off ramp')return `Take the exit${road}`;

const SPEED={drive:8,keke:5,okada:8.5,bus:6,train:12,walk:1.3,bike:3.6};
let nav=null,muted=false;
function say(t){if(muted||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices();
  u.voice=vs.find(v=>v.lang==='en-NG')||vs.find(v=>/en[-_]GB/.test(v.lang))||null;speechSynthesis.cancel();speechSynthesis.speak(u);}
function makePuck(){const el=document.createElement('div');el.className='puck';

function snapList(list,coords,cum){return list.map(x=>{const sn=snap(coords,cum,x,1,coords.length);return {...x,at:sn.along,off:sn.dist};}).filter(x=>x.off<40);}
async function startNav(mode){
  const r=current.res[mode];if(!r||r.na)return;

  let steps=r.legs.length===1&&r.legs[0].steps?r.legs[0].steps.map(s=>({...s}))
    :r.legs.map(l=>({text:l.text,arrow:l.type==='walk'?'🚶':l.type==='keke'?'🛺':l.type==='danfo'?'🚐':'🚆',loc:l.coords[0]})).concat([{text:'You have arrived',arrow:'⚑',loc:coords[coords.length-1]}]);
  const cum=cumDist(coords);let j=0;steps.forEach(s=>{const sn=snap(coords,cum,P(s.loc),j,coords.length);s.at=sn.along;j=Math.max(1,sn.i-1);});
  nav={mode,coords,cum,steps,reports:snapList(loadReports(),coords,cum),signals:(r.extras&&r.extras.signals)||[],seg:1,spoken:new Set(),off:0,dest:current.d,sim:true,simD:0,
    puck:makePuck().setLngLat(coords[0]).addTo(map)};
  sheet.hidden=true;$('#ctrls').hidden=true;$('#layers').hidden=true;$('#navTop').hidden=$('#navBot').hidden=$('#navChips').hidden=false;
  $('#ly3d').checked=true;applyLayerVis();if(window.speechSynthesis)speechSynthesis.getVoices();
  if(!nav.signals.length&&r.road)routeExtras(coords).then(x=>{if(x&&nav){r.extras=x;nav.signals=x.signals;}}).catch(()=>{});
  let real=null;try{real=await myLocation();}catch(e){}
  if(!nav)return;
  if(real&&inNigeria(real)&&snap(coords,cum,real,1,coords.length).dist<300){
    nav.sim=false;
    nav.watch=navigator.geolocation.watchPosition(p=>update({lng:p.coords.longitude,lat:p.coords.latitude,heading:p.coords.heading,speed:p.coords.speed}),
      ()=>toast('Lost GPS signal. Keep going; it will reconnect.'),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
    say(steps[0].text);
  }else{

    nav.timer=setInterval(()=>{nav.simD+=SPEED[mode]*4;const p=pointAt(coords,cum,nav.simD);update({lng:p.lng,lat:p.lat,heading:p.bearing,speed:SPEED[mode]});},1000);

}
async function update(pos){

  map.easeTo({center:[pos.lng,pos.lat],bearing:heading,pitch:64,zoom:{walk:18.2,bike:17.8,train:15.5}[nav.mode]||17.4,duration:950,easing:t=>t,padding:{top:innerHeight*.42,bottom:90,left:0,right:0}});
  const next=steps.find(s=>s.at>along+8)||steps[steps.length-1],dn=Math.max(0,next.at-along),key=steps.indexOf(next);

    const st=await signalState(sig);if(st&&st.state){txt=`${{red:'🔴',amber:'🟡',green:'🟢'}[st.state]||'🚦'} ${st.state} ${st.remaining!=null?Math.round(st.remaining)+' s':''} in ${ds} m`;}
    chip.textContent=txt;chip.hidden=false;
    if(ds<=220&&!nav.spoken.has('g'+sig.id)){nav.spoken.add('g'+sig.id);say(st&&st.state?`Traffic light ahead is ${st.state}`:'Traffic light ahead');}}
  else chip.hidden=true;
  // Reports ahead
  const ahead=nav.reports.find(x=>x.at>along&&x.at-along<500&&!nav.spoken.has('r'+x.id));
  if(ahead){nav.spoken.add('r'+ahead.id);const [l,i]=REPORTS[ahead.type];say(`${l} reported ahead`);
    const a=$('#alertChip');a.textContent=`${i} ${l} reported ahead`;a.hidden=false;setTimeout(()=>a.hidden=true,6000);}
  if(!nav.sim){nav.off=s2.dist>60?nav.off+1:0;if(nav.off>=3){nav.off=0;reroute(pos);}}
  if(rem<25){say('You have arrived at '+nav.dest.name);toast('You’ve arrived.');endNav();}
}
async function reroute(pos){
  if(nav.rerouting||!['drive','keke','okada','walk','bike'].includes(nav.mode))return;nav.rerouting=true;say('Rerouting');
  const r=await roadRoute(nav.mode==='walk'?'foot':nav.mode==='bike'?'bike':'driving',pos,nav.dest);
  if(r&&nav){nav.coords=r.coords;nav.cum=cumDist(r.coords);nav.steps=r.steps.map(s=>({...s}));let j=0;
    nav.steps.forEach(s=>{const sn=snap(nav.coords,nav.cum,P(s.loc),j,nav.coords.length);s.at=sn.along;j=Math.max(1,sn.i-1);});
    nav.reports=snapList(loadReports(),nav.coords,nav.cum);nav.signals=[];nav.seg=1;nav.spoken=new Set();
    setFC('route',fc([{type:'Feature',properties:{type:'ride',color:'#12805A'},geometry:{type:'LineString',coordinates:r.coords}}]));}
  if(nav)nav.rerouting=false;
}
function endNav(){
  if(!nav)return;clearInterval(nav.timer);if(nav.watch!=null)navigator.geolocation.clearWatch(nav.watch);nav.puck.remove();nav=null;
  if(window.speechSynthesis)speechSynthesis.cancel();
  $('#navTop').hidden=$('#navBot').hidden=$('#navChips').hidden=true;sheet.hidden=false;$('#ctrls').hidden=false;
  map.easeTo({pitch:0,bearing:0,padding:{top:0,bottom:0,left:0,right:0},duration:600});
  if(current){setSnap('half');routeView();}else homeView();
}
$('#navEnd').onclick=endNav;
$('#navMute').onclick=()=>{muted=!muted;$('#navMute').textContent=muted?'🔇':'🔊';if(muted&&window.speechSynthesis)speechSynthesis.cancel();};

/* ======================= Road reports ======================= */
const RKEY='ona.reports.v1';
function loadReports(){const now=Date.now();return store.get(RKEY,[]).filter(r=>REPORTS[r.type]&&now-r.t<REPORTS[r.type][2]*60000);}
let repMarkers=[];
const ago=t=>{const m=(Date.now()-t)/60000;return m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago';};
function renderReports(){
  repMarkers.forEach(m=>m.remove());
  repMarkers=loadReports().map(r=>{const [l,i]=REPORTS[r.type],el=document.createElement('div');el.className='rep';el.textContent=i;
    if(!$('#lyReports').checked)el.style.display='none';
    el.onclick=ev=>{ev.stopPropagation();new maplibregl.Popup().setLngLat([r.lng,r.lat]).setHTML(`<div class="pop"><b>${i} ${l}</b>Reported ${ago(r.t)}<br>
      <button onclick="confirmReport('${r.id}')">Still there</button><button onclick="removeReport('${r.id}')">It’s gone</button></div>`).addTo(map);};
    return new maplibregl.Marker({element:el}).setLngLat([r.lng,r.lat]).addTo(map);});
}
const closePops=()=>document.querySelectorAll('.maplibregl-popup').forEach(p=>p.remove());
window.confirmReport=id=>{const a=loadReports(),r=a.find(x=>x.id===id);if(r)r.t=Date.now();store.set(RKEY,a);renderReports();closePops();toast('Thanks. Report confirmed.');};
window.removeReport=id=>{store.set(RKEY,loadReports().filter(x=>x.id!==id));renderReports();closePops();toast('Report removed.');};
$('#rgrid').innerHTML=Object.entries(REPORTS).map(([k,[l,i]])=>`<button data-type="${k}"><span>${i}</span>${l}</button>`).join('');
$('#repBtn').onclick=$('#navRep').onclick=()=>{$('#repModal').hidden=false;};
$('#repClose').onclick=()=>$('#repModal').hidden=true;
$('#rgrid').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;$('#repModal').hidden=true;let at=null,where='at your location';
  if(nav){const ll=nav.puck.getLngLat();at={lat:ll.lat,lng:ll.lng};}
  else{try{const p=await myLocation();if(inNigeria(p))at=p;}catch(err){}if(!at){const c=map.getCenter();at={lat:c.lat,lng:c.lng};where='at the centre of the map';}}
  const a=loadReports();a.push({id:Math.random().toString(36).slice(2,10),type:b.dataset.type,lat:at.lat,lng:at.lng,t:Date.now()});store.set(RKEY,a);renderReports();
  toast(`${REPORTS[b.dataset.type][0]} reported ${where}.`);
});

/* My location button */
let me=null;
$('#meBtn').onclick=async()=>{try{const p=await myLocation();
  if(!inNigeria(p)){toast('You’re outside Nigeria right now. Search a Lagos place instead.');return;}
  me&&me.remove();me=new maplibregl.Marker({element:Object.assign(document.createElement('div'),{className:'pin o'})}).setLngLat([p.lng,p.lat]).addTo(map);
  map.flyTo({center:[p.lng,p.lat],zoom:16,padding:{top:0,bottom:snapPx,left:0,right:0}});}catch(e){toast('Location permission is off. Turn it on in Settings, or search a place.');}};

/* ======================= Voice input (Nigerian English and Pidgin phrasing) ======================= */
function parseTrip(raw){
  const t=raw.toLowerCase().replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim(),HERE=/^(here|my location|where i dey|where i am|current location)$/;
  const dest='(?:to|i (?:wan|want to|wanna) go(?: to)?|wan go(?: to)?|going to|enter)';
  let m=t.match(new RegExp(`(?:from|i dey(?: for)?|i am at|i'm at|i am in|i'm in)\\s+(.+?)\\s+(?:and\\s+)?${dest}\\s+(.+)$`));
  if(m)return {from:HERE.test(m[1])?'':m[1],to:m[2]};
  m=t.match(/(?:take me to|carry me go|i (?:wan|want to|wanna) go(?: to)?|go to|directions to|how (?:i|do i|can i) (?:fit )?(?:go|get to|reach))\s+(.+)$/);
  if(m)return {from:'',to:m[1]};
  return {from:null,to:t};
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function startVoice(){
  if(!SR){toast('Voice input isn’t supported in this browser. Try Chrome, or type your trip.');return;}
  rec=new SR();rec.lang=$('#vlang').value;rec.interimResults=true;$('#voice').hidden=false;$('#vtext').textContent='Listening…';let finalText='';
  rec.onresult=e=>{let s='';for(const r of e.results){s+=r[0].transcript;if(r.isFinal)finalText=s;}$('#vtext').textContent='“'+s+'”';};
  rec.onerror=e=>{$('#vtext').textContent=e.error==='not-allowed'?'Microphone permission is off. Allow it in your browser settings.':'Didn’t catch that. Tap the mic and try again.';};
  rec.onend=()=>{if(!finalText){setTimeout(()=>$('#voice').hidden=true,1600);return;}
    const p=parseTrip(finalText);$('#voice').hidden=true;if(p.from!==null)trip.from={text:p.from,sel:null};trip.to={text:p.to,sel:null};findRoutes();};
  rec.start();
}
$('#vstop').onclick=()=>{rec&&rec.stop();};
$('#vlang').onchange=()=>{if(rec){rec.abort();startVoice();}};

homeView();
</script>
